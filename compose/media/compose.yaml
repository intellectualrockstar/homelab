services:
  sonarr:
    container_name: sonarr
    hostname: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - "192.168.51.15:8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./config/sonarr:/config
      - downloads:/mnt/Downloads
      - media-library:/mnt/MediaLibrary
    restart: unless-stopped

  radarr:
    container_name: radarr
    hostname: radarr
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - "192.168.51.15:7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./config/radarr:/config
      - downloads:/mnt/Downloads
      - media-library:/mnt/MediaLibrary
    restart: unless-stopped

  prowlarr:
    container_name: prowlarr
    hostname: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    ports:
      - "192.168.51.15:9696:9696"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  sabnzbd:
    container_name: sabnzbd
    hostname: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    ports:
      - "192.168.51.15:8080:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - ./config/sabnzbd:/config
      - downloads:/mnt/Downloads
    restart: unless-stopped

  seerr:
    container_name: seerr
    hostname: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    user: "1000:1000"
    ports:
      - "192.168.51.15:5055:5055"
    environment:
      TZ: America/New_York
      PORT: "5055"
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

volumes:
  downloads:
    name: media-downloads
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.8,nfsvers=4,rw,hard
      device: ":/mnt/MediaStorage/Downloads"

  media-library:
    name: media-library
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.10.8,nfsvers=4,rw,hard
      device: ":/mnt/MediaStorage/PlexLibrary"
